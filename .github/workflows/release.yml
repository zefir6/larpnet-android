name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      list_tracks_only:
        description: "Diagnostic only: list Play Console tracks via the API, skip building/publishing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  github-release:
    if: ${{ !inputs.list_tracks_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Decode release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/release.jks"

      - name: Build github-flavor release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleGithubRelease --no-daemon

      - name: Clean up keystore
        if: always()
        run: rm -f "${{ runner.temp }}/release.jks"

      - name: Read app version
        id: version
        run: |
          NAME=$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/github/release/app-github-release.apk \
             "dist/larpnet-${{ steps.version.outputs.name }}-${{ github.run_number }}.apk"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}-${{ github.run_number }}
          name: Larpnet ${{ steps.version.outputs.name }} (build ${{ github.run_number }})
          files: dist/*.apk
          generate_release_notes: true

  play-store-release:
    if: ${{ !inputs.list_tracks_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Decode release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/release.jks"

      - name: Build playstore-flavor release AAB
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew bundlePlaystoreRelease --no-daemon

      - name: Clean up keystore
        if: always()
        run: rm -f "${{ runner.temp }}/release.jks"

      - name: Read app version
        id: version
        run: |
          NAME=$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Rename AAB
        run: |
          mkdir -p dist
          cp app/build/outputs/bundle/playstoreRelease/app-playstore-release.aab \
             "dist/larpnet-${{ steps.version.outputs.name }}-${{ github.run_number }}.aab"

      - name: Upload AAB as build artifact
        uses: actions/upload-artifact@v7
        with:
          name: larpnet-${{ steps.version.outputs.name }}-${{ github.run_number }}-aab
          path: dist/*.aab
          retention-days: 90

      - name: Publish to Play Console (internal, draft)
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: pl.larpnet.android
          releaseFiles: dist/*.aab
          tracks: internal
          status: draft

  # Diagnostic only, run via "Run workflow" with list_tracks_only checked. Play Console's UI only
  # shows a numeric track ID in the URL for custom tracks (e.g. closed testing), not the string
  # the Play Developer API expects in the `tracks:` input above -- this looks it up directly.
  list-play-tracks:
    if: ${{ inputs.list_tracks_only }}
    runs-on: ubuntu-latest
    steps:
      # Signs a JWT with the service account's own private key and exchanges it directly at
      # Google's OAuth2 token endpoint (RFC 7523), rather than using google-github-actions/auth's
      # default path of minting a token via the IAM Service Account Credentials API -- that path
      # needs the service account granted Token Creator on itself, an extra IAM grant with no
      # purpose here beyond this one lookup. This needs nothing but the key itself.
      - name: List tracks via Play Developer API
        env:
          SA_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }

          CLIENT_EMAIL=$(jq -r .client_email <<<"$SA_JSON")
          PRIVATE_KEY=$(jq -r .private_key <<<"$SA_JSON")
          NOW=$(date +%s)
          EXP=$((NOW + 3600))

          HEADER=$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)
          CLAIMS=$(printf '{"iss":"%s","scope":"https://www.googleapis.com/auth/androidpublisher","aud":"https://oauth2.googleapis.com/token","iat":%s,"exp":%s}' \
            "$CLIENT_EMAIL" "$NOW" "$EXP" | b64url)
          UNSIGNED="$HEADER.$CLAIMS"
          SIGNATURE=$(printf '%s' "$UNSIGNED" | openssl dgst -sha256 -sign <(printf '%s' "$PRIVATE_KEY") | b64url)
          JWT="$UNSIGNED.$SIGNATURE"

          TOKEN=$(curl -sf -X POST https://oauth2.googleapis.com/token \
            -d "grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer" \
            -d "assertion=$JWT" | jq -r .access_token)

          PKG="pl.larpnet.android"
          EDIT_ID=$(curl -sf -X POST -H "Authorization: Bearer $TOKEN" \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PKG/edits" \
            | jq -r .id)
          curl -sf -H "Authorization: Bearer $TOKEN" \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PKG/edits/$EDIT_ID/tracks" \
            | jq .
          curl -sf -X POST -H "Authorization: Bearer $TOKEN" \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PKG/edits/$EDIT_ID:delete" \
            -o /dev/null -w "Edit cleanup HTTP status: %{http_code}\n"
