name: Play Store Build

on:
  push:
    branches: [play-store]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: play-store-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Decode release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/release.jks"

      - name: Build release AAB
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        # bundleRelease -> AAB, the format Play Console requires. Not for public distribution
        # (unlike release.yml's APK, which goes to a public GitHub release for the in-app
        # update-notification flow), so this uploads to a build artifact instead -- see below.
        run: ./gradlew bundleRelease --no-daemon

      - name: Clean up keystore
        if: always()
        run: rm -f "${{ runner.temp }}/release.jks"

      - name: Read app version
        id: version
        run: |
          NAME=$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Rename AAB
        run: |
          mkdir -p dist
          cp app/build/outputs/bundle/release/app-release.aab \
             "dist/larpnet-${{ steps.version.outputs.name }}-${{ github.run_number }}.aab"

      - name: Upload AAB for Play Console
        uses: actions/upload-artifact@v7
        with:
          name: larpnet-${{ steps.version.outputs.name }}-${{ github.run_number }}-aab
          path: dist/*.aab
          retention-days: 90
